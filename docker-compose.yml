services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: hss
      POSTGRES_PASSWORD: hss_dev_only
      POSTGRES_DB: hss
    ports:
      - "127.0.0.1:5440:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro

volumes:
  pgdata:
