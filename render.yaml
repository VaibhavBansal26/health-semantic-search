# Render Blueprint: one free web service built from the Dockerfile.
# The three secrets are asked for when the Blueprint is created; none is stored in this repository.
services:
  - type: web
    name: health-semantic-search
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    autoDeploy: false
    envVars:
      - key: HSS_ADMIN_EMAIL
        sync: false
      - key: HSS_ADMIN_PASSWORD
        sync: false
      - key: HSS_JWT_PRIVATE_KEY
        sync: false
